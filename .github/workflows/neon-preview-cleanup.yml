# Delete Neon preview DB branches when a PR closes (merge or close).
# Native Neon/Vercel cleanup is often delayed (Vercel keeps preview deployments;
# Neon-managed cleanup may wait until the next preview deploy). See docs/neon-vercel-setup.md.
#
# Three Vercel projects each have their own Neon. Cleaning only
# vars.NEON_PROJECT_ID (MJ) leaves demo + Convergent preview branches in place
# until the project hits the branch cap and new andrei-demo previews sit on
# "Building" indefinitely.
name: Cleanup Neon preview branch

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      mode:
        description: "list = report branches; prune = delete preview/* not used by an open PR"
        type: choice
        options:
          - list
          - prune
        default: list

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.ref != 'main' &&
       github.event.pull_request.head.ref != 'master')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mj
            project_id: ${{ vars.NEON_PROJECT_ID }}
          - name: demo
            project_id: bold-field-45608643
          - name: convergent
            project_id: cold-thunder-36255681
    steps:
      - name: Skip empty project id
        if: matrix.project_id == ''
        run: |
          echo "No project id for ${{ matrix.name }}; skip."
          exit 0

      - name: Install neonctl
        if: matrix.project_id != ''
        run: npm i -g neonctl@v2

      - name: List branches
        if: matrix.project_id != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "::group::${{ matrix.name }} (${{ matrix.project_id }})"
          neonctl branches list --project-id "${{ matrix.project_id }}"
          echo "::endgroup::"

      - name: Delete preview branch (preview/<git-branch>)
        id: delete-by-ref
        if: github.event_name == 'pull_request' && matrix.project_id != ''
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ matrix.project_id }}
          branch: preview/${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Delete preview branch (preview/pr-<n>-<git-branch>)
        if: >-
          github.event_name == 'pull_request' &&
          matrix.project_id != '' &&
          steps.delete-by-ref.outcome == 'failure'
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ matrix.project_id }}
          branch: preview/pr-${{ github.event.number }}-${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Prune stale preview branches
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prune' && matrix.project_id != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: ${{ matrix.project_id }}
          PROJECT_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          open_refs="$(mktemp)"
          gh pr list --state open --limit 100 --json headRefName --jq '.[].headRefName' > "$open_refs"
          echo "Open PR git refs:"
          cat "$open_refs"
          # JSON array of {name}
          json="$(neonctl branches list --project-id "$PROJECT_ID" --output json)"
          mapfile -t names < <(echo "$json" | jq -r '
            if type == "array" then .[].name
            else (.branches // [])[].name
            end
          ')
          echo "Prune candidates on $PROJECT_NAME:"
          deleted=0
          kept=0
          for name in "${names[@]}"; do
            rest="${name#preview/}"
            keep=0
            if [[ "$name" != preview/* ]]; then
              keep=1
            elif [[ "$rest" == "main" || "$rest" == "master" || "$rest" == "production" || "$rest" == "prod" || "$rest" == "dev" ]]; then
              keep=1
            elif grep -Fxq "$rest" "$open_refs"; then
              keep=1
            elif [[ "$rest" =~ ^pr-[0-9]+-(.+)$ ]] && grep -Fxq "${BASH_REMATCH[1]}" "$open_refs"; then
              keep=1
            fi
            if [[ "$keep" -eq 1 ]]; then
              echo "keep  $name"
              kept=$((kept + 1))
              continue
            fi
            echo "delete $name"
            neonctl branches delete "$name" --project-id "$PROJECT_ID"
            deleted=$((deleted + 1))
          done
          echo "Pruned $deleted stale preview branch(es); kept $kept."
