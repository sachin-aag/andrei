# Delete Neon preview DB branches when a PR closes or a git branch is deleted.
# Native Neon/Vercel cleanup is often delayed (Vercel keeps preview deployments;
# Neon-managed cleanup may wait until the next preview deploy). See docs/neon-vercel-setup.md.
#
# Project ids live in src/lib/db/neon-preview-projects.ts (hardcoded fallbacks).
# GitHub NEON_PROJECT_ID_* vars are optional overrides — do not skip a pack
# when they are unset (that left 3xper preview branches behind).
name: Cleanup Neon preview branch

on:
  pull_request:
    types: [closed]
  delete:

jobs:
  delete-branch:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref != 'main' &&
       github.event.pull_request.head.ref != 'master') ||
      (github.event_name == 'delete' &&
       github.event.ref_type == 'branch' &&
       github.event.ref != 'main' &&
       github.event.ref != 'master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete preview branches for this git ref
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.event.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          NEON_PROJECT_ID_MJ: ${{ vars.NEON_PROJECT_ID_MJ }}
          NEON_PROJECT_ID_DEMO: ${{ vars.NEON_PROJECT_ID_DEMO }}
          NEON_PROJECT_ID_CONVERGENT: ${{ vars.NEON_PROJECT_ID_CONVERGENT }}
          NEON_PROJECT_ID_3XPER: ${{ vars.NEON_PROJECT_ID_3XPER }}
        run: pnpm tsx scripts/cleanup-neon-preview-branch-for-ref.ts
