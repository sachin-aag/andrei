# Weekly cleanup of stale Neon preview/* branches across customer Neon projects.
# Complements PR-close / git-branch-delete cleanup and Vercel preview-branch retention.
# Project ids: src/lib/db/neon-preview-projects.ts (GitHub vars optional override).
name: Cleanup stale Neon preview branches

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: Delete preview/* branches older than this many days
        required: false
        default: "14"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete stale preview branches
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_STALE_PREVIEW_BRANCH_MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '14' }}
          NEON_PROJECT_ID_MJ: ${{ vars.NEON_PROJECT_ID_MJ }}
          NEON_PROJECT_ID_DEMO: ${{ vars.NEON_PROJECT_ID_DEMO }}
          NEON_PROJECT_ID_CONVERGENT: ${{ vars.NEON_PROJECT_ID_CONVERGENT }}
          NEON_PROJECT_ID_3XPER: ${{ vars.NEON_PROJECT_ID_3XPER }}
        run: pnpm tsx scripts/cleanup-stale-neon-preview-branches.ts
