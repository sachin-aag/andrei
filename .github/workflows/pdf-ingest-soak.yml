# Credentialed PDF extract soak against the real sample fixture.
#
# Manual: Actions → PDF ingest soak → Run workflow
# Nightly: schedule below (informational — not a required PR check)
#
# Secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_VERTEX_PROJECT
#   GCP_WORKLOAD_IDENTITY_PROVIDER  — projects/.../workloadIdentityPools/.../providers/...
#   GCP_SERVICE_ACCOUNT_EMAIL       — GitHub Actions SA (Vertex AI User)
#
# Do not add GCP_SERVICE_ACCOUNT_KEY (org policy blocks JSON keys).
#
# Optional:
#   DOCUMENT_EXTRACT_GOOGLE_MODEL_ID (defaults in code to gemini-3.1-flash-lite)
#
# Fork PRs / missing secrets: job skips cleanly.

name: PDF ingest soak

on:
  workflow_dispatch:
    inputs:
      batches:
        description: "Max extract batches (empty = all)"
        required: false
        default: "3"
      pages:
        description: "Optional page range A-B (empty = all selected batches)"
        required: false
        default: ""
  schedule:
    # 06:00 UTC daily — keep non-blocking / informational
    - cron: "0 6 * * *"

concurrency:
  group: pdf-ingest-soak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  soak:
    name: Extract soak (Vertex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Check Vertex secrets
        id: gcp
        run: |
          if [ -z "$GOOGLE_VERTEX_PROJECT" ] || [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] || [ -z "$GCP_SERVICE_ACCOUNT_EMAIL" ]; then
            echo "::notice title=PDF ingest soak skipped::Add GOOGLE_VERTEX_PROJECT, GCP_WORKLOAD_IDENTITY_PROVIDER, and GCP_SERVICE_ACCOUNT_EMAIL Actions secrets."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GOOGLE_VERTEX_PROJECT: ${{ secrets.GOOGLE_VERTEX_PROJECT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Install dependencies
        if: steps.gcp.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        if: steps.gcp.outputs.skip == 'false'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Run PDF extract soak
        if: steps.gcp.outputs.skip == 'false'
        env:
          GOOGLE_VERTEX_PROJECT: ${{ secrets.GOOGLE_VERTEX_PROJECT }}
          DOCUMENT_EXTRACT_GOOGLE_MODEL_ID: ${{ vars.DOCUMENT_EXTRACT_GOOGLE_MODEL_ID }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          BATCHES="${{ github.event.inputs.batches }}"
          PAGES="${{ github.event.inputs.pages }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Nightly: first 3 batches keeps cost bounded
            EXTRA_ARGS+=(--batches 3)
          else
            if [ -n "$BATCHES" ]; then
              EXTRA_ARGS+=(--batches "$BATCHES")
            fi
            if [ -n "$PAGES" ]; then
              EXTRA_ARGS+=(--pages "$PAGES")
            fi
          fi
          pnpm exec tsx scripts/soak-document-ingest.ts "${EXTRA_ARGS[@]}"
